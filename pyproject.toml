[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phlight"
version = "0.1.0"
description = "Local ADS-B aircraft portrait renderer for a color e-paper frame"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["pillow>=10.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
phlight-render = "phlight.render.cli:main"

[tool.setuptools]
packages = ["phlight", "phlight.render"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"