[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "phlight"
version = "0.1.0"
description = "A framed portrait of the aircraft flying overhead, built from a local ADS-B receiver."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = ["pillow>=10.1"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
phlight-render = "phlight.render.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["phlight"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"