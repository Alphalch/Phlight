name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install --upgrade pip pillow pytest
      - name: Run tests
        run: python -m pytest -q
      - name: Smoke-render the fixtures
        run: |
          python -m phlight.render.cli fixtures/overhead_snapshot.json --out out/portrait.png
          python -m phlight.render.cli fixtures/empty_sky_snapshot.json --out out/empty.png --palette dusk